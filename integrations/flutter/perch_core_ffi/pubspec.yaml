name: perch_core_ffi
description: 把 PerchCore 的 Rust 核心（crates/perch-ffi）静态链接进 Flutter App
repository: https://github.com/Sycamore-awa/PerchCore
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PerchCoreFfiPlugin
