name: Core CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-host:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-core-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Minimal Rust client
        run: cargo run -p perch-core --example inspect -- examples/data/sample.txt 文字
      - name: Shared and static FFI library
        run: cargo build -p perch-ffi --release --locked
      - name: C client
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extension=so
          if [ "$RUNNER_OS" = "macOS" ]; then extension=dylib; fi
          cmake -S examples/c -B target/c-example -DPERCH_CORE_LIBRARY="${PWD}/target/release/libperch_ffi.${extension}"
          cmake --build target/c-example
          ctest --test-dir target/c-example --output-on-failure

  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check all targets and features
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

  ios-cross:
    name: iOS Rust cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust and targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-ios-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-ios-core-
      - name: Cross-check
        run: |
          cargo check --workspace --all-features --locked --target aarch64-apple-ios
          cargo check --workspace --all-features --locked --target aarch64-apple-ios-sim
          cargo check --workspace --all-features --locked --target x86_64-apple-ios
      - name: Static library
        run: cargo rustc -p perch-ffi --release --locked --target aarch64-apple-ios --crate-type staticlib
      - name: Exported ABI symbols
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm
          python3 tools/check_ios_symbols.py target/aarch64-apple-ios/release/libperch_ffi.a

  dart-ffi:
    name: Dart C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Dart SDK
        run: |
          curl -fSL -o /tmp/dart.zip https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-linux-x64-release.zip
          unzip -q /tmp/dart.zip -d "$HOME"
          echo "$HOME/dart-sdk/bin" >> "$GITHUB_PATH"
      - name: FFI library
        run: cargo build -p perch-ffi --release --locked
      - name: Binding and real ABI smoke
        working-directory: bindings/dart/perch_core
        run: |
          dart pub get
          dart analyze
          dart run tool/ffi_smoke.dart ../../../target/release/libperch_ffi.so
          dart run example/main.dart ../../../target/release/libperch_ffi.so ../../../examples/data/sample.txt
